name: Update progress

on:
  push:
    branches: [main]
    paths:
      - "CHECKLIST.md"
      - "daily-log/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update README progress and streak
        run: python3 scripts/update_progress.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/progress.svg
          git commit -m "Update progress and streak"
          git push
